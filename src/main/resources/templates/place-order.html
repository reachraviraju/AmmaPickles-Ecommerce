<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Place Order — Amma Pickles</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Playfair+Display:wght@700;900&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>

<body id="place-order-page">

    <!-- NAVBAR -->
    <div th:replace="fragments/navbar :: navbar"></div>

    <!-- PAGE HEADER -->
    <div class="page-hdr">
        <h2>📦 Place Order</h2>
        <p>Select a delivery address to confirm your order</p>
    </div>

    <div class="cart-main">

        <!-- Back to cart -->
        <a href="/cart" class="pd-back" style="display:inline-flex; margin-bottom:1.5rem;">
            <i class="bi bi-arrow-left"></i> Back to Cart
        </a>

        <!-- NO ADDRESS -->
        <div th:if="${addresses == null or addresses.empty}">
            <div class="empty-box">
                <div class="icon">📍</div>
                <h3>No saved addresses!</h3>
                <p>You need to add a delivery address before placing an order.</p>
                <a href="/addresses/add" class="btn-shop">Add Address →</a>
            </div>
        </div>

        <!-- ADDRESS SELECTION -->
        <div th:unless="${addresses == null or addresses.empty}">

            <!-- ── ORDER FORM — no nested forms inside ── -->
            <form th:action="@{/orders/place}" method="post" id="orderForm">
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}"/>

                <div class="row g-3 mb-4">

                    <!-- Section label + Add New -->
                    <div class="col-12 addr-section-head">
                        <span class="addr-section-label">Select Delivery Address</span>
                        <a href="/addresses/add" class="addr-add-new">
                            <i class="bi bi-plus-circle"></i> Add New
                        </a>
                    </div>

                    <!-- ADDRESS CARD — no forms inside -->
                    <div class="col-md-6" th:each="address : ${addresses}">
                        <div class="address-card-wrapper">

                            <label th:for="'addr-' + ${address.id}" class="address-card">
                                <input type="radio"
                                       name="addressId"
                                       th:id="'addr-' + ${address.id}"
                                       th:value="${address.id}"
                                       required/>
                                <div class="addr-card-body">
                                    <div class="addr-street"
                                         th:text="${address.street}"></div>
                                    <div class="addr-detail"
                                         th:text="${address.city} + ', ' + ${address.district}"></div>
                                    <div class="addr-detail"
                                         th:text="${address.state} + ' - ' + ${address.pincode}"></div>
                                    <div class="addr-distance"
                                         th:if="${address.distanceInKm != null}">
                                        <i class="bi bi-geo-alt-fill"></i>
                                        <span th:text="${address.distanceInKm} + ' km from warehouse'"></span>
                                    </div>
                                </div>
                            </label>

                            <!-- Edit / Delete buttons -->
                            <div class="addr-actions">

                                <!-- Edit — opens modal -->
                                <button type="button"
                                        class="addr-action-btn edit"
                                        title="Edit address"
                                        th:data-id="${address.id}"
                                        th:data-street="${address.street}"
                                        th:data-city="${address.city}"
                                        th:data-district="${address.district}"
                                        th:data-state="${address.state}"
                                        th:data-pincode="${address.pincode}"
                                        th:data-distance="${address.distanceInKm}"
                                        onclick="openEditModal(this)">
                                    <i class="bi bi-pencil"></i>
                                </button>

                                <!-- Delete — calls standalone form outside order form -->
                                <button type="button"
                                        class="addr-action-btn delete"
                                        title="Delete address"
                                        th:data-id="${address.id}"
                                        onclick="deleteAddress(this)">
                                    <i class="bi bi-trash3"></i>
                                </button>

                            </div>
                        </div>
                    </div>

                </div>

                <button type="submit" class="btn-order" style="max-width:340px;">
                    Confirm Order →
                </button>

            </form>

            <!-- ── DELETE FORMS — outside order form so no nesting issue ── -->
            <div th:each="address : ${addresses}">
                <form th:id="'delete-form-' + ${address.id}"
                      th:action="@{/addresses/delete/{id}(id=${address.id})}"
                      method="post"
                      style="display:none;">
                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}"/>
                </form>
            </div>

        </div>

    </div>

    <!-- EDIT ADDRESS MODAL -->
    <div id="editModal" class="ap-modal-overlay" onclick="closeEditModal()">
        <div class="ap-modal" onclick="event.stopPropagation()">

            <div class="ap-modal-head">
                <span>Edit Address</span>
                <button type="button" onclick="closeEditModal()" class="ap-modal-close">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>

            <form id="editForm" method="post">
                <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>

                <label class="ap-label">Street</label>
                <input class="ap-input" type="text" id="edit-street" name="street" required/>

                <label class="ap-label">City</label>
                <input class="ap-input" type="text" id="edit-city" name="city" required/>

                <label class="ap-label">District</label>
                <input class="ap-input" type="text" id="edit-district" name="district"/>

                <label class="ap-label">State</label>
                <input class="ap-input" type="text" id="edit-state" name="state" required/>

                <label class="ap-label">Pincode</label>
                <input class="ap-input" type="text" id="edit-pincode" name="pincode" required/>

                <label class="ap-label">Distance from Warehouse (km)</label>
                <input class="ap-input" type="number" step="0.1"
                       id="edit-distance" name="distanceInKm"/>

                <button type="submit" class="btn-ap">Save Changes →</button>
            </form>

        </div>
    </div>

    <!-- FOOTER -->
    <div th:replace="fragments/footer :: footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>

        // Open edit modal and pre-fill fields
        function openEditModal(btn) {
            document.getElementById('edit-street').value   = btn.dataset.street   || '';
            document.getElementById('edit-city').value     = btn.dataset.city     || '';
            document.getElementById('edit-district').value = btn.dataset.district || '';
            document.getElementById('edit-state').value    = btn.dataset.state    || '';
            document.getElementById('edit-pincode').value  = btn.dataset.pincode  || '';
            document.getElementById('edit-distance').value = btn.dataset.distance || '';
            document.getElementById('editForm').action     = '/addresses/edit/' + btn.dataset.id;
            document.getElementById('editModal').classList.add('open');

            // Focus first field after modal opens
            setTimeout(() => {
                document.getElementById('edit-street').focus();
            }, 100);
        }

        // Close modal
        function closeEditModal() {
            document.getElementById('editModal').classList.remove('open');
        }

        // Delete address — submit standalone form outside order form
        function deleteAddress(btn) {
            if (confirm('Delete this address?')) {
                document.getElementById('delete-form-' + btn.dataset.id).submit();
            }
        }

        // Enter key → next field inside modal
        document.addEventListener('DOMContentLoaded', () => {
            const modalInputs = Array.from(
                document.querySelectorAll('#editForm .ap-input')
            );
            modalInputs.forEach((input, index) => {
                input.addEventListener('keydown', e => {
                    if (e.key === 'Enter' && index < modalInputs.length - 1) {
                        e.preventDefault();
                        modalInputs[index + 1].focus();
                    }
                });
                input.addEventListener('focus', () => {
                    setTimeout(() => {
                        input.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }, 150);
                });
            });
        });

        // Close modal on Escape
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeEditModal();
        });

    </script>

</body>
</html>
