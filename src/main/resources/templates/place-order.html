<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Place Order — Amma Pickles</title>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Playfair+Display:wght@700;900&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>

<body id="place-order-page">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="page-hdr">
    <h2>📦 Place Order</h2>
    <p>Select a delivery address to confirm your order</p>
</div>

<div class="cart-main">

    <a href="/cart" class="pd-back">
        <i class="bi bi-arrow-left"></i> Back to Cart
    </a>

    <!-- NO ADDRESS -->
    <div th:if="${addresses == null or addresses.empty}">
        <div class="empty-box">
            <h3>No saved addresses!</h3>
            <a href="/addresses/add" class="btn-shop">Add Address →</a>
        </div>
    </div>

    <!-- ADDRESS LIST -->
    <div th:unless="${addresses == null or addresses.empty}">

        <!-- ORDER FORM -->
        <form th:action="@{/orders/place}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div th:each="address : ${addresses}" class="address-card">

                <label>
                    <input type="radio" name="addressId" th:value="${address.id}" required/>

                    <div><b th:text="${address.name}"></b></div>
                    <div th:text="${address.street}"></div>
                    <div th:text="${address.city} + ', ' + ${address.district}"></div>
                    <div th:text="${address.state} + ' - ' + ${address.pincode}"></div>

                    <div th:if="${address.mobileNumber != null}">
                        📞 <span th:text="${address.mobileNumber}"></span>
                    </div>
                </label>

                <!-- ACTION BUTTONS -->
                <div style="margin-top:10px; display:flex; gap:10px;">

                    <!-- EDIT -->
                    <button type="button"
                            th:data-id="${address.id}"
                            th:data-name="${address.name}"
                            th:data-street="${address.street}"
                            th:data-city="${address.city}"
                            th:data-district="${address.district}"
                            th:data-state="${address.state}"
                            th:data-pincode="${address.pincode}"
                            th:data-mobile="${address.mobileNumber}"
                            onclick="openEditModal(this)">
                        Edit
                    </button>

                    <!-- DELETE (NO NESTED FORM) -->
                    <button type="button"
                            th:onclick="'deleteAddress(' + ${address.id} + ')'">
                        Delete
                    </button>

                </div>

            </div>

            <button type="submit" class="btn-order">Confirm Order →</button>
        </form>

    </div>
</div>

<!-- EDIT MODAL -->
<div id="editModal" style="display:none;">
    <form id="editForm" method="post">

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <label>Name</label>
        <input type="text" id="edit-name" name="name" required/>

        <label>Street</label>
        <input type="text" id="edit-street" name="street" required/>

        <label>City</label>
        <input type="text" id="edit-city" name="city" required/>

        <label>District</label>
        <input type="text" id="edit-district" name="district"/>

        <label>State</label>
        <input type="text" id="edit-state" name="state" required/>

        <label>Pincode</label>
        <input type="text" id="edit-pincode" name="pincode" required/>

        <label>Mobile</label>
        <input type="text" id="edit-mobile" name="mobileNumber" required/>

        <button type="submit">Save</button>
    </form>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script>

function openEditModal(btn) {
    document.getElementById('edit-name').value = btn.dataset.name || '';
    document.getElementById('edit-street').value = btn.dataset.street || '';
    document.getElementById('edit-city').value = btn.dataset.city || '';
    document.getElementById('edit-district').value = btn.dataset.district || '';
    document.getElementById('edit-state').value = btn.dataset.state || '';
    document.getElementById('edit-pincode').value = btn.dataset.pincode || '';
    document.getElementById('edit-mobile').value = btn.dataset.mobile || '';

    document.getElementById('editForm').action = '/addresses/edit/' + btn.dataset.id;
    document.getElementById('editModal').style.display = 'block';
}

// DELETE HANDLER (no nested form issue)
function deleteAddress(id) {
    if (confirm("Delete this address?")) {
        const form = document.createElement("form");
        form.method = "POST";
        form.action = "/addresses/delete/" + id;

        const csrf = document.createElement("input");
        csrf.type = "hidden";
        csrf.name = "_csrf";
        csrf.value = document.querySelector('input[name="_csrf"]').value;

        form.appendChild(csrf);
        document.body.appendChild(form);
        form.submit();
    }
}

</script>

</body>
</html>
