<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<body>

<th:block th:fragment="navbar">

<nav class="ap-navbar">

    <!-- Logo -->
    <a href="/home" class="logo-opt1">
        <span class="amma shine-gold">AMMA</span>
        <div class="gold-line"></div>
        <span class="pickles">Pickles</span>
    </a>

    <!-- Welcome message (desktop only) -->
    <span class="welcome-txt"
          th:if="${username != null}"
          th:text="'Hello !! 👋 ' + ${username}"
          style="font-weight:800;font-size:1rem;font-family:'Cinzel',serif;letter-spacing:1px;background:linear-gradient(105deg,#C9920A 0%,#E8B84B 30%,#FFF0A0 50%,#E8B84B 70%,#C9920A 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">
    </span>

    <!-- Nav Pills (desktop) -->
    <div class="nav-pills nav-pills-desktop">

        <a href="/admin/dashboard" class="pill-gold"
           sec:authorize="hasRole('ADMIN')" style="margin-right:0.3rem;">
            <i class="bi bi-speedometer2"></i> Admin Panel
        </a>

        <a href="/cart" class="pill-gold"
           th:if="${username != null}">
            <i class="bi bi-cart3"></i> Cart
        </a>

        <a href="/orders" class="pill-ghost"
           th:if="${username != null}">
            <i class="bi bi-box-seam"></i> My Orders
        </a>

        <a href="/custom-pickle" class="pill-custom-pickle" title="Craft Your Custom Artisanal Pickle">
            <i class="bi bi-stars"></i> Custom Pickle
        </a>

        <a href="/profile" class="pill-ghost"
           th:if="${username != null}">
            <i class="bi bi-person-circle"></i>
        </a>

        <form th:if="${username != null}"
              th:action="@{/logout}"
              method="post"
              style="margin:0; padding:0;">
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}"/>
            <button type="submit" class="pill-ghost"
                    style="background:transparent; cursor:pointer;">
                <i class="bi bi-box-arrow-right"></i> Logout
            </button>
        </form>

        <a href="/login" class="pill-ghost"
           th:unless="${username != null}">
            Login
        </a>

        <a href="/register" class="pill-gold"
           th:unless="${username != null}">
            Register
        </a>

    </div>

    <!-- Hamburger (mobile) -->
    <button class="nav-hamburger" id="navHamburger" aria-label="Open menu">
        <i class="bi bi-list"></i>
    </button>

</nav>

<!-- Mobile overlay -->
<div class="mobile-overlay" id="mobileOverlay"></div>

<!-- Mobile drawer -->
<div class="mobile-drawer" id="mobileDrawer">

    <div class="drawer-header">
        <span class="amma shine-gold"
              style="font-family:'Cinzel',serif;font-size:1.2rem;font-weight:900;letter-spacing:5px;">
            AMMA
        </span>
        <button class="drawer-close" id="drawerClose">
            <i class="bi bi-x-lg"></i>
        </button>
    </div>

    <div th:if="${username != null}" class="drawer-user">
        <div class="drawer-avatar"><i class="bi bi-person-circle"></i></div>
        <div th:text="'Hello, ' + ${username}"
             style="font-family:'Cinzel',serif;font-size:1.1rem;font-weight:900;letter-spacing:2px;background:linear-gradient(105deg,#C9920A 0%,#E8B84B 30%,#FFF0A0 50%,#E8B84B 70%,#C9920A 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">
        </div>
    </div>

    <div class="drawer-links">

        <a href="/home" class="drawer-link">
            <i class="bi bi-house"></i> Home
        </a>

        <div sec:authorize="hasRole('ADMIN')">
            <a href="/admin/dashboard" class="drawer-link" style="color:var(--gold-mid)!important;font-weight:700;">
                <i class="bi bi-speedometer2"></i> Admin Panel
            </a>
        </div>

        <a href="/custom-pickle" class="drawer-link" style="color:var(--gold-lt)!important;font-weight:700;">
            <i class="bi bi-stars"></i> Custom Pickle
        </a>

        <div th:if="${username != null}">
            <a href="/cart" class="drawer-link">
                <i class="bi bi-cart3"></i> My Cart
            </a>
            <a href="/orders" class="drawer-link">
                <i class="bi bi-box-seam"></i> My Orders
            </a>
            <a href="/profile" class="drawer-link">
                <i class="bi bi-person-circle"></i> Profile
            </a>
            <hr class="drawer-divider"/>
            <form th:action="@{/logout}" method="post" style="margin:0;">
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}"/>
                <button type="submit"
                        class="drawer-link drawer-logout"
                        style="width:100%;text-align:left;">
                    <i class="bi bi-box-arrow-right"></i> Logout
                </button>
            </form>
        </div>

        <div th:unless="${username != null}">
            <a href="/login" class="drawer-link">
                <i class="bi bi-person"></i> Login
            </a>
            <a href="/register" class="drawer-link drawer-register">
                <i class="bi bi-person-plus"></i> Register
            </a>
        </div>

    </div>

</div>

<script>
(function(){
    const ham = document.getElementById('navHamburger');
    const drawer = document.getElementById('mobileDrawer');
    const overlay = document.getElementById('mobileOverlay');
    const closeBtn = document.getElementById('drawerClose');
    function openDrawer(){
        drawer.classList.add('open');
        overlay.classList.add('open');
        document.body.style.overflow='hidden';
    }
    function closeDrawer(){
        drawer.classList.remove('open');
        overlay.classList.remove('open');
        document.body.style.overflow='';
    }
    if(ham) ham.addEventListener('click', openDrawer);
    if(closeBtn) closeBtn.addEventListener('click', closeDrawer);
    if(overlay) overlay.addEventListener('click', closeDrawer);
})();
</script>

<!-- Dynamic Floating AI Custom Pickle Widget with Spinning Gold Ring -->
<div class="custom-pickle-floating-widget widget-hidden" id="customPickleWidget">
    <div class="widget-speech-bubble" id="widgetBubble">
        <span class="bubble-text">Want custom pickle? <strong>Chat with Amma AI ✨</strong></span>
        <button type="button" class="bubble-close" onclick="dismissCustomPickleBubble(event)" aria-label="Close tooltip">&times;</button>
    </div>
    <a href="/custom-pickle" class="widget-btn-wrapper" title="Craft Your Custom Pickle with Amma AI">
        <span class="widget-mini-chip">Custom ✨</span>
        <div class="widget-spin-aura"></div>
        <div class="widget-outer-spin-ring"></div>
        <div class="widget-spin-ring-secondary"></div>
        <div class="widget-inner-btn">
            <span class="widget-jar-icon">🫙</span>
        </div>
    </a>
</div>

<script>
function dismissCustomPickleBubble(e) {
    if (e) e.stopPropagation();
    const w = document.getElementById('customPickleWidget');
    if (w) {
        w.classList.remove('widget-visible');
        w.classList.add('widget-hidden');
        w.style.display = 'none';
    }
    try { sessionStorage.setItem('dismissCustomBubble', 'true'); } catch(err){}
}

(function() {
    try {
        const widget = document.getElementById('customPickleWidget');
        if (!widget) return;

        // Never show on custom pickle chat / order page
        if (window.location.pathname.includes('custom-pickle')) {
            widget.style.display = 'none';
            return;
        }

        // Never show if dismissed in this session
        if (sessionStorage.getItem('dismissCustomBubble') === 'true') {
            widget.style.display = 'none';
            return;
        }

        // 10s Visible + 6s Hidden Timing (in milliseconds)
        const VISIBLE_DURATION = 10000; // 10 seconds visible
        const HIDDEN_DURATION  = 6000;  // 6 seconds hidden
        const INITIAL_DELAY    = 2000;  // 2 seconds on page load

        let hideTimer = null;
        let reappearTimer = null;
        let isInteracting = false;

        function showWidget() {
            if (isInteracting || sessionStorage.getItem('dismissCustomBubble') === 'true') return;
            widget.classList.remove('widget-hidden');
            widget.classList.add('widget-visible');

            clearTimeout(hideTimer);
            hideTimer = setTimeout(function() {
                if (!isInteracting) {
                    hideWidget();
                }
            }, VISIBLE_DURATION);
        }

        function hideWidget() {
            if (sessionStorage.getItem('dismissCustomBubble') === 'true') return;
            widget.classList.remove('widget-visible');
            widget.classList.add('widget-hidden');

            clearTimeout(reappearTimer);
            reappearTimer = setTimeout(function() {
                showWidget();
            }, HIDDEN_DURATION);
        }

        // Pause timer while user is hovering or touching
        widget.addEventListener('mouseenter', function() {
            isInteracting = true;
            clearTimeout(hideTimer);
        });
        widget.addEventListener('mouseleave', function() {
            isInteracting = false;
            hideTimer = setTimeout(hideWidget, 3500);
        });
        widget.addEventListener('touchstart', function() {
            isInteracting = true;
            clearTimeout(hideTimer);
        }, { passive: true });
        widget.addEventListener('touchend', function() {
            isInteracting = false;
            hideTimer = setTimeout(hideWidget, 5000);
        }, { passive: true });

        // Initial launch after 2 seconds
        setTimeout(showWidget, INITIAL_DELAY);

    } catch(err) {
        console.error("Custom pickle widget error:", err);
    }
})();
</script>

</th:block>

</body>
</html>
