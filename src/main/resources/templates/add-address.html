<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Add Address — Amma Pickles</title>

    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="page-hdr">
    <h2>📍 Add Address</h2>
    <p>Enter your delivery details</p>
</div>

<div class="cart-main">

    <!-- 🔥 FORM START (THIS WAS MISSING) -->
    <form th:action="@{/addresses/add}" method="post">

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="ap-card" style="max-width:500px; margin:auto;">

            <!-- NAME -->
            <label class="ap-label">Name</label>
            <input class="ap-input" type="text" name="name" required/>

            <!-- STREET -->
            <label class="ap-label">Street</label>
            <input class="ap-input" type="text" name="street" required/>

            <!-- CITY -->
            <label class="ap-label">City</label>
            <input class="ap-input" type="text" name="city" required/>

            <!-- DISTRICT -->
            <label class="ap-label">District</label>
            <input class="ap-input" type="text" name="district"/>

            <!-- STATE -->
            <label class="ap-label">State</label>
            <input class="ap-input" type="text" name="state" required/>

            <!-- PINCODE -->
            <label class="ap-label">Pincode</label>
            <input class="ap-input" type="text" name="pincode" required/>

            <!-- MOBILE -->
            <label class="ap-label">Mobile Number</label>
            <input class="ap-input" type="text" name="mobileNumber" required/>

            <!-- BUTTON -->
            <button type="submit" class="btn-ap" style="margin-top:1rem;">
                Save Address →
            </button>

        </div>

    </form>
    <!-- 🔥 FORM END -->

    <div style="text-align:center; margin-top:1rem;">
        <a href="/place-order" class="pd-back">
            ← Back to Order
        </a>
    </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
