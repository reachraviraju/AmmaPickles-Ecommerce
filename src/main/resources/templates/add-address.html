<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Add Address — Amma Pickles</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet"/>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>

    <!-- Your CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>

<body>

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5" style="max-width:600px;">

    <h2 class="mb-4">📍 Add New Address</h2>

    <form th:action="@{/addresses/add}" method="post">

        <!-- CSRF -->
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <!-- NAME -->
        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" name="name" class="form-control" required/>
        </div>

        <!-- STREET -->
        <div class="mb-3">
            <label class="form-label">Street</label>
            <input type="text" name="street" class="form-control" required/>
        </div>

        <!-- CITY -->
        <div class="mb-3">
            <label class="form-label">City</label>
            <input type="text" name="city" class="form-control" required/>
        </div>

        <!-- DISTRICT -->
        <div class="mb-3">
            <label class="form-label">District</label>
            <input type="text" name="district" class="form-control"/>
        </div>

        <!-- STATE -->
        <div class="mb-3">
            <label class="form-label">State</label>
            <input type="text" name="state" class="form-control" required/>
        </div>

        <!-- PINCODE -->
        <div class="mb-3">
            <label class="form-label">Pincode</label>
            <input type="text" name="pincode" class="form-control" required/>
        </div>

        <!-- MOBILE -->
        <div class="mb-3">
            <label class="form-label">Mobile Number</label>
            <input type="text" name="mobileNumber" class="form-control" required/>
        </div>

        <!-- BUTTONS -->
        <div class="d-flex justify-content-between">
            <a href="/place-order" class="btn btn-secondary">← Back</a>
            <button type="submit" class="btn btn-warning">Save Address</button>
        </div>

    </form>

</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
