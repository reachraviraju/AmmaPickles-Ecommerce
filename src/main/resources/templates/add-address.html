<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Add Address — AmmA Pickles</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Playfair+Display:wght@700;900&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<nav class="ap-navbar">
    <a href="/home" class="logo-opt1">
        <span class="amma shine-gold">AMMA</span>
        <div class="gold-line"></div>
        <span class="pickles">Pickles</span>
    </a>
    <div class="nav-pills">
        <span class="welcome-txt" th:if="${username != null}" th:text="'👋 ' + ${username}"></span>
        <a href="/orders/place" class="pill-ghost"><i class="bi bi-arrow-left"></i> Back</a>
        <a href="/logout" class="pill-text"><i class="bi bi-box-arrow-right"></i></a>
    </div>
</nav>

<div class="page-hdr">
    <h2>📍 Add Delivery Address</h2>
    <p>Add a new address for delivery</p>
</div>

<div class="cart-main">
    <div style="max-width:560px;margin:0 auto;">
        <div class="auth-card">

            <form th:action="@{/addresses/add}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <label class="ap-label">Street / House No.</label>
                <input class="ap-input" type="text" name="street"
                       placeholder="e.g. 12-3, MG Road" required/>

                <label class="ap-label">City</label>
                <input class="ap-input" type="text" name="city"
                       placeholder="e.g. Vijayawada" required/>

                <label class="ap-label">District <span style="color:rgba(255,255,255,0.2);font-size:0.7rem;">(optional)</span></label>
                <input class="ap-input" type="text" name="district"
                       placeholder="e.g. Krishna"/>

                <label class="ap-label">State</label>
                <input class="ap-input" type="text" name="state"
                       placeholder="e.g. Andhra Pradesh" required/>

                <label class="ap-label">Pincode</label>
                <input class="ap-input" type="text" name="pincode"
                       placeholder="e.g. 520001"
                       pattern="^[1-9][0-9]{5}$"
                       title="Enter a valid 6-digit pincode" required/>

                <label class="ap-label">Distance from Warehouse (km)</label>
                <input class="ap-input" type="number" name="distanceInKm"
                       placeholder="e.g. 15.5"
                       min="0" step="0.1" required/>
                <div style="font-size:0.7rem;color:rgba(255,255,255,0.2);
                            margin-top:-0.8rem;margin-bottom:1.2rem;">
                    📏 Used to calculate delivery charges
                </div>

                <button type="submit" class="btn-ap">
                    Save Address →
                </button>
            </form>

        </div>
    </div>
</div>

<div class="ap-footer">
    Made with ❤️ by <span class="shine-gold" style="font-size:inherit;">Amma Pickles</span>
    &nbsp;·&nbsp; Authentic Taste, Every Time
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
