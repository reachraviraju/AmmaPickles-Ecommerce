<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>

<title>My Orders — Amma Pickles</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Playfair+Display:wght@700;900&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet"/>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>

<link th:href="@{/css/style.css}" rel="stylesheet"/>

</head>

<body>

<div th:replace="fragments/navbar :: navbar"></div>

<div class="page-hdr">
    <h2>📦 My Orders</h2>
    <p>Track your pickle deliveries</p>
</div>

<div class="orders-main">

    <!-- EMPTY STATE -->
    <div th:if="${orders == null or orders.empty}" class="empty-box">

        <div class="icon">📦</div>

        <h3>No orders yet</h3>

        <p>You haven't placed any orders yet.</p>

        <a href="/home" class="btn-shop">
            Browse Pickles →
        </a>

    </div>


    <!-- ORDER LIST -->
    <div th:each="order : ${orders}" class="order-card">

        <div class="order-hdr">

            <div>
                <div class="order-id"
                     th:text="'Order #' + ${order.id}">
                </div>

                <div class="order-date"
                     th:text="${#temporals.format(order.orderDate,'dd MMM yyyy')}">
                </div>
            </div>

            <span class="status-badge"
                  th:classappend="' status-' + ${order.status}"
                  th:text="${order.status}">
            </span>

        </div>



        <div class="order-body">

            <div class="addr-row">

                📍 Delivering to:

                <span th:text="${order.address.street}"></span>,
                <span th:text="${order.address.city}"></span>,
                <span th:text="${order.address.state}"></span>
                -
                <span th:text="${order.address.pincode}"></span>

            </div>


            <table class="items-tbl">

                <thead>
                <tr>
                    <th>Item</th>
                    <th>Size</th>
                    <th>Qty</th>
                    <th class="text-end">Amount</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="item : ${order.items}">

                    <td th:text="${item.productName}"></td>

                    <td th:text="${item.sizeLabel}"></td>

                    <td th:text="${item.quantity}"></td>

                    <td class="amt text-end"
                        th:text="'₹' + ${item.price * item.quantity}">
                    </td>

                </tr>

                </tbody>

            </table>

        </div>



        <div class="order-ftr">

            <div class="ftr-item">
                <div class="fl">Items</div>
                <div class="fv"
                     th:text="${order.totalItems}">
                </div>
            </div>

            <div class="ftr-item">
                <div class="fl">Delivery</div>
                <div class="fv">FREE</div>
            </div>

            <div class="ftr-item grand">
                <div class="fl">Total</div>
                <div class="fv shine-gold"
                     th:text="'₹' + ${order.totalAmount}">
                </div>
            </div>


            <!-- CANCEL BUTTON -->
            <form th:if="${order.status == 'PENDING'}"
                  th:action="@{/orders/cancel/{id}(id=${order.id})}"
                  method="post">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}"/>

                <button class="btn-cancel">
                    Cancel Order
                </button>

            </form>

        </div>

    </div>

</div>


<div th:replace="fragments/footer :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
