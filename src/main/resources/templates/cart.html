<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>

<title>My Cart — Amma Pickles</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Playfair+Display:wght@700;900&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet"/>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>

<link th:href="@{/css/style.css}" rel="stylesheet"/>

</head>

<body>

<div th:replace="fragments/navbar :: navbar"></div>

<div class="page-hdr">

<h2>🛒 My Cart</h2>

<p th:if="${cart != null}"
   th:text="${cart.totalItems} + ' item(s) in your cart'">
</p>

</div>

<div class="cart-main">

<div class="row g-4">

<div class="col-12"
     th:if="${cart == null or cart.items.empty}">

<div class="empty-box">

<div class="icon">🛒</div>

<h3>Your cart is empty!</h3>

<p>Looks like you haven't added any pickles yet.</p>

<a href="/home" class="btn-shop">
Browse Pickles →
</a>

</div>

</div>

<div class="col-lg-8"
     th:unless="${cart == null or cart.items.empty}">

<div class="cart-item"
     th:each="item : ${cart.items}">

<div class="ci-icon">🫙</div>

<div class="ci-info">

<div class="ci-name"
     th:text="${item.productName}">
</div>

<div class="ci-size"
     th:if="${item.sizeLabel != null}"
     th:text="'Size: ' + ${item.sizeLabel}">
</div>

<div class="ci-price"
     th:text="'₹' + ${item.price} + ' per jar'">
</div>

</div>

<form th:action="@{/cart/update/{id}(id=${item.cartItemId})}"
      method="post"
      style="display:flex;align-items:center;gap:0.4rem;">

<input type="hidden"
    th:name="${_csrf.parameterName}"
    th:value="${_csrf.token}"/>

<button type="submit"
     name="quantity"
     th:value="${item.quantity - 1}"
     class="qty-btn">
− </button>

<span class="ci-qty"
   th:text="${item.quantity}"> </span>

<button type="submit"
     name="quantity"
     th:value="${item.quantity + 1}"
     class="qty-btn">
+ </button>

</form>

<div class="ci-total shine-gold"
     th:text="'₹' + ${item.itemTotal}">
</div>

<form th:action="@{/cart/remove/{id}(id=${item.cartItemId})}"
      method="post">

<input type="hidden"
    th:name="${_csrf.parameterName}"
    th:value="${_csrf.token}"/>

<button type="submit"
     class="btn-remove"
     title="Remove item">

<i class="bi bi-trash3"></i>

</button>

</form>

</div>

</div>

<div class="col-lg-4"
     th:unless="${cart == null or cart.items.empty}">

<div class="summary-card">

<div class="summary-title">
Order Summary
</div>

<div class="free-del"
     th:if="${cart.cartTotal >= 500}">

🎉 You qualify for FREE delivery!

</div>

<div class="s-row">

<span class="lbl">Subtotal</span>

<span class="val"
   th:text="'₹' + ${cart.cartTotal}"> </span>

</div>

<div class="s-row">

<span class="lbl">Delivery</span>

<span class="val"
   th:text="${cart.cartTotal >= 500} ? 'FREE' : 'Calculated at checkout'"> </span>

</div>

<div class="s-row">

<span class="lbl">Items</span>

<span class="val"
   th:text="${cart.totalItems}"> </span>

</div>

<hr class="s-divider"/>

<div class="s-total">

<span class="tl">Total</span>

<span class="tv shine-gold"
   th:text="'₹' + ${cart.cartTotal}"> </span>

</div>

<a href="/orders/place"
class="btn-order">

Proceed to Order →

</a>

<div class="del-note">

🚚 Free delivery on orders above ₹500

</div>

</div>

</div>

</div>

</div>

<div th:replace="fragments/footer :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
