<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Reset Password — AmmA Pickles</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Playfair+Display:wght@700;900&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body class="auth-body">
<div class="auth-wrap">

    <div class="logo-badge-wrap">
        <div class="logo-opt4">
            <span class="amma shine-gold">AMMA</span>
            <div class="divline"></div>
            <span class="pickles">Pickles</span>
        </div>
        <div class="logo-tagline">Authentic · Homemade</div>
    </div>

    <div class="auth-card">
        <h4>Reset Password</h4>
        <div class="sub">Enter your new password below</div>

        <!-- Error message (expired/invalid token) -->
        <div class="alert-ap" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/reset-password}" method="post">

            <!-- Hidden token — passed along with the new password -->
            <input type="hidden" name="token" th:value="${token}"/>

            <label class="ap-label" for="newPassword">New Password</label>
            <div style="position:relative;">
                <input class="ap-input" type="password" id="newPassword" name="newPassword"
                       placeholder="Min 8 chars, 1 number, 1 special character"
                       style="padding-right: 3rem; margin-bottom: 0;" required/>
                <button type="button" onclick="toggleNew()" id="eyeBtnNew"
                        style="position:absolute; right:1rem; top:50%; transform:translateY(-50%);
                               background:transparent; border:none; cursor:pointer;
                               color:rgba(212,160,23,0.6); font-size:1.1rem; padding:0;
                               transition: color 0.2s;">
                    <i class="bi bi-eye" id="eyeIconNew"></i>
                </button>
            </div>
            <div style="margin-bottom: 0.6rem;"></div>

            <label class="ap-label" for="confirmPassword">Confirm New Password</label>
            <div style="position:relative;">
                <input class="ap-input" type="password" id="confirmPassword"
                       placeholder="Re-enter your new password"
                       style="padding-right: 3rem; margin-bottom: 0;" required/>
                <button type="button" onclick="toggleConfirm()" id="eyeBtnConfirm"
                        style="position:absolute; right:1rem; top:50%; transform:translateY(-50%);
                               background:transparent; border:none; cursor:pointer;
                               color:rgba(212,160,23,0.6); font-size:1.1rem; padding:0;
                               transition: color 0.2s;">
                    <i class="bi bi-eye" id="eyeIconConfirm"></i>
                </button>
            </div>

            <!-- Password mismatch warning -->
            <div id="mismatchMsg"
                 style="color:#ff6b6b; font-size:0.82rem; margin-top:0.4rem; display:none;">
                <i class="bi bi-exclamation-circle"></i> Passwords do not match
            </div>

            <div style="margin-bottom: 1.2rem;"></div>

            <button type="submit" id="submitBtn" class="btn-ap">Set New Password →</button>
        </form>

        <div class="auth-divider"><span>or</span></div>
        <div class="auth-footer">
            <a href="/forgot-password">Request a new reset link</a>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function toggleNew() {
        const input = document.getElementById('newPassword');
        const icon  = document.getElementById('eyeIconNew');
        const btn   = document.getElementById('eyeBtnNew');
        const show  = input.type === 'text';
        input.type       = show ? 'password' : 'text';
        icon.className   = show ? 'bi bi-eye' : 'bi bi-eye-slash';
        btn.style.color  = show ? 'rgba(212,160,23,0.6)' : 'rgba(212,160,23,1)';
    }

    function toggleConfirm() {
        const input = document.getElementById('confirmPassword');
        const icon  = document.getElementById('eyeIconConfirm');
        const btn   = document.getElementById('eyeBtnConfirm');
        const show  = input.type === 'text';
        input.type       = show ? 'password' : 'text';
        icon.className   = show ? 'bi bi-eye' : 'bi bi-eye-slash';
        btn.style.color  = show ? 'rgba(212,160,23,0.6)' : 'rgba(212,160,23,1)';
    }

    // Real-time confirm password match check
    function checkMatch() {
        const pw  = document.getElementById('newPassword').value;
        const cpw = document.getElementById('confirmPassword').value;
        const msg = document.getElementById('mismatchMsg');
        const btn = document.getElementById('submitBtn');

        if (cpw.length > 0 && pw !== cpw) {
            msg.style.display = 'block';
            btn.disabled = true;
        } else {
            msg.style.display = 'none';
            btn.disabled = false;
        }
    }

    document.getElementById('newPassword').addEventListener('input', checkMatch);
    document.getElementById('confirmPassword').addEventListener('input', checkMatch);
</script>
</body>
</html>
