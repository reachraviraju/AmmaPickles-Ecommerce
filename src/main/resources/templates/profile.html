<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>My Profile — Amma Pickles</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Playfair+Display:wght@700;900&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>

<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="page-hdr">
        <h2>👤 My Profile</h2>
        <p>Manage your account information</p>
    </div>

    <div class="cart-main">

        <!-- Success / Error messages -->
        <div th:if="${param.updated}"
             style="background:rgba(40,167,69,0.12);border:1px solid rgba(40,167,69,0.4);border-radius:12px;padding:1rem 1.5rem;margin-bottom:1.5rem;display:flex;align-items:center;gap:0.75rem;color:#a8e6b0;">
            <i class="bi bi-check-circle-fill" style="font-size:1.3rem;"></i>
            <strong>Profile updated successfully!</strong>
        </div>

        <div class="row g-4">

            <!-- LEFT: Avatar + quick info -->
            <div class="col-lg-4">
                <div class="profile-avatar-card">
                    <div class="profile-avatar-circle">
                        <i class="bi bi-person-fill"></i>
                    </div>
                    <div class="profile-name" th:text="${user.username}">Username</div>
                    <div class="profile-email" th:text="${user.email}">email@example.com</div>

                    <div class="profile-meta-row" th:if="${user.phoneNumber != null}">
                        <i class="bi bi-telephone"></i>
                        <span th:text="${user.phoneNumber}"></span>
                    </div>

                    <div class="profile-stats-row">
                        <div class="pstat">
                            <div class="pstat-num shine-gold" th:text="${orderCount ?: 0}">0</div>
                            <div class="pstat-lbl">Orders</div>
                        </div>
                        <div class="pstat">
                            <div class="pstat-num shine-gold" th:text="${addressCount ?: 0}">0</div>
                            <div class="pstat-lbl">Addresses</div>
                        </div>
                    </div>

                    <a href="/orders" class="btn-shop" style="margin-top:1rem;display:block;text-align:center;">
                        📦 View Orders
                    </a>
                    <a href="/addresses/add" class="pill-ghost" style="margin-top:0.75rem;display:block;text-align:center;padding:0.5rem 1rem;border-radius:25px;text-decoration:none;font-size:0.85rem;">
                        <i class="bi bi-plus-circle"></i> Add Address
                    </a>
                </div>
            </div>

            <!-- RIGHT: Edit form -->
            <div class="col-lg-8">
                <div class="profile-edit-card">
                    <div class="profile-section-title">Edit Information</div>

                    <form th:action="@{/profile/update}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="ap-label">Username</label>
                                <input class="ap-input" type="text" name="fullName"
                                       th:value="${user.username}"
                                       placeholder="Your username" required/>
                            </div>
                            <div class="col-md-6">
                                <label class="ap-label">Phone Number</label>
                                <input class="ap-input" type="tel" name="phone"
                                       th:value="${user.phoneNumber}"
                                       placeholder="10-digit mobile number"/>
                            </div>
                            <div class="col-12">
                                <label class="ap-label">Email Address</label>
                                <input class="ap-input" type="email"
                                       th:value="${user.email}"
                                       placeholder="email@example.com"
                                       disabled
                                       style="opacity:0.5; cursor:not-allowed;"/>
                                <small style="color:var(--text-muted);font-size:0.75rem;">Email cannot be changed.</small>
                            </div>
                        </div>

                        <div class="profile-section-title" style="margin-top:2rem;">Change Password</div>
                        <div style="color:var(--text-muted);font-size:0.82rem;margin-bottom:1rem;">Leave blank to keep your current password.</div>

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="ap-label">New Password</label>
                                <input class="ap-input" type="password" name="newPassword"
                                       placeholder="New password (min 8 chars)"/>
                            </div>
                            <div class="col-md-6">
                                <label class="ap-label">Confirm Password</label>
                                <input class="ap-input" type="password" name="confirmPassword"
                                       placeholder="Repeat new password"/>
                            </div>
                        </div>

                        <button type="submit" class="btn-order" style="margin-top:2rem;border:none;cursor:pointer;width:auto;display:inline-block;padding:0.9rem 2.5rem;">
                            <i class="bi bi-check2-circle"></i> Save Changes
                        </button>
                    </form>
                </div>

                <!-- Saved Addresses section -->
                <div class="profile-edit-card" style="margin-top:1.5rem;" th:if="${addresses != null and !addresses.empty}">
                    <div class="profile-section-title">Saved Addresses</div>
                    <div th:each="addr : ${addresses}" class="profile-addr-row">
                        <div class="addr-icon"><i class="bi bi-geo-alt-fill"></i></div>
                        <div class="addr-text" th:text="${addr.street + ', ' + addr.city + ', ' + addr.state + ' — ' + addr.pincode}">
                        </div>
                        <form th:action="@{/addresses/delete/{id}(id=${addr.id})}" method="post" style="margin:0;">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn-remove" title="Remove address">
                                <i class="bi bi-trash3"></i>
                            </button>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
