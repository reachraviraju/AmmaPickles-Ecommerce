<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Forgot Password — AmmA Pickles</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Playfair+Display:wght@700;900&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>

<div class="auth-page no-scroll">
  <div class="auth-box">

    <!-- Gold scroll ribbon -->
    <div class="auth-scroll">
      <div class="auth-scroll-track">
        <span class="auth-scroll-item">✦ RESET YOUR PASSWORD</span>
        <span class="auth-scroll-sep">◆</span>
        <span class="auth-scroll-item">WE'LL SEND YOU A LINK</span>
        <span class="auth-scroll-sep">◆</span>
        <span class="auth-scroll-item">✦ RESET YOUR PASSWORD</span>
        <span class="auth-scroll-sep">◆</span>
        <span class="auth-scroll-item">WE'LL SEND YOU A LINK</span>
        <span class="auth-scroll-sep">◆</span>
        <span class="auth-scroll-item">✦ RESET YOUR PASSWORD</span>
        <span class="auth-scroll-sep">◆</span>
        <span class="auth-scroll-item">WE'LL SEND YOU A LINK</span>
        <span class="auth-scroll-sep">◆</span>
      </div>
    </div>

    <!-- AMMA Logo -->
    <div class="auth-logo">
      <div class="auth-logo-inner">
        <span class="amma shine-gold">AMMA</span>
        <div class="gold-line"></div>
        <span class="pickles">Pickles</span>
      </div>
    </div>

    <!-- Card -->
    <div class="auth-card">

      <div class="auth-sub">Enter your email and we'll send you a reset link</div>

      <!-- Success -->
      <div class="alert-ap alert-ap-success" th:if="${success}" th:text="${success}"></div>

      <!-- Form — hidden after success -->
      <form th:action="@{/forgot-password}" method="post" th:if="${success == null}">

        <label class="ap-label">Email Address</label>
        <input class="ap-input" type="email" name="email"
               placeholder="your@email.com" required/>

        <button type="submit" class="btn-ap">Send Reset Link →</button>
      </form>

      <div class="auth-divider"><span>or</span></div>
      <div class="auth-footer">Remembered it? <a href="/login">Back to Login</a></div>

    </div>

    <div class="auth-watermark">AMMA PICKLES</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
