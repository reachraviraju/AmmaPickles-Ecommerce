<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Forgot Password — AmmA Pickles</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Playfair+Display:wght@700;900&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body class="auth-body">
<div class="auth-wrap">

    <div class="logo-badge-wrap">
        <div class="logo-opt4">
            <span class="amma shine-gold">AMMA</span>
            <div class="divline"></div>
            <span class="pickles">Pickles</span>
        </div>
        <div class="logo-tagline">Authentic · Homemade</div>
    </div>

    <div class="auth-card">
        <h4>Forgot Password?</h4>
        <div class="sub">Enter your email and we'll send you a reset link</div>

        <!-- Success message -->
        <div class="alert-ap"
             style="background: rgba(40,167,69,0.12); border-color: rgba(40,167,69,0.4); color: #a8e6b0;"
             th:if="${success}"
             th:text="${success}">
        </div>

        <!-- Only show form if no success yet -->
        <form th:action="@{/forgot-password}" method="post" th:if="${success == null}">

            <label class="ap-label">Email Address</label>
            <input class="ap-input" type="email" name="email"
                   placeholder="your@email.com" required/>

            <div style="margin-bottom: 1.2rem;"></div>

            <button type="submit" class="btn-ap">Send Reset Link →</button>
        </form>

        <div class="auth-divider"><span>or</span></div>
        <div class="auth-footer">
            Remembered it? <a href="/login">Back to Login</a>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
