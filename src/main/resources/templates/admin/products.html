<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Products — Amma Pickles Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Playfair+Display:wght@700;900&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
    <div th:replace="~{fragments/admin-navbar :: adminNavbar}"></div>
    <div class="page-hdr">
        <h2>🫙 Products</h2>
        <p>Manage your pickle products</p>
    </div>
    <div class="cart-main">
        <div th:if="${success}" class="flash-success">
            <i class="bi bi-check-circle-fill"></i>
            <span th:text="${success}"></span>
        </div>
        <div style="margin-bottom:1.5rem;">
            <a href="/admin/products/add" class="btn-order"
               style="width:auto;display:inline-block;padding:0.7rem 2rem;text-decoration:none;">
                <i class="bi bi-plus-circle"></i> Add New Product
            </a>
        </div>
        <div th:if="${products == null or products.empty}" class="empty-box">
            <div class="icon">🫙</div>
            <h3>No products yet</h3>
            <p>Add your first product!</p>
        </div>
        <div th:unless="${products == null or products.empty}" class="admin-table-wrap">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Category</th>
                        <th>Size</th>
                        <th>Price</th>
                        <th>Stock</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="product : ${products}">
                        <td class="td-muted" th:text="${product.id}"></td>
                        <td style="color:white;font-family:'Playfair Display',serif;" th:text="${product.name}"></td>
                        <td class="td-muted" th:text="${product.categoryName}"></td>
                        <td class="td-muted" th:text="${product.sizeLabel ?: 'Standard'}"></td>
                        <td class="td-gold" th:text="'₹' + ${product.price}"></td>
                        <td class="td-muted" th:text="${product.quantity}"></td>
                        <td>
                            <span th:if="${product.inStock}" style="color:#81C784;font-size:0.75rem;font-weight:700;">
                                ● In Stock
                            </span>
                            <span th:unless="${product.inStock}" style="color:#EF9A9A;font-size:0.75rem;font-weight:700;">
                                ● Out of Stock
                            </span>
                        </td>
                        <td style="display:flex;gap:0.4rem;align-items:center;">
                            <a th:href="@{/admin/products/edit/{id}(id=${product.id})}"
                               class="addr-action-btn edit" title="Edit">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/admin/products/delete/{id}(id=${product.id})}"
                                  method="post" style="margin:0;">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="addr-action-btn delete"
                                        onclick="return confirm('Delete this product?')" title="Delete">
                                    <i class="bi bi-trash3"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div th:if="${products != null and products.totalPages > 1}"
             style="display:flex;justify-content:center;gap:0.5rem;margin-top:1.5rem;flex-wrap:wrap;">
            <a th:if="${!products.first}"
               th:href="@{/admin/products(page=${products.number - 1})}"
               class="filter-btn">← Prev</a>
            <span th:each="i : ${#numbers.sequence(0, products.totalPages - 1)}">
                <a th:href="@{/admin/products(page=${i})}"
                   th:text="${i + 1}"
                   class="filter-btn"
                   th:classappend="${products.number == i} ? ' active' : ''"></a>
            </span>
            <a th:if="${!products.last}"
               th:href="@{/admin/products(page=${products.number + 1})}"
               class="filter-btn">Next →</a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
