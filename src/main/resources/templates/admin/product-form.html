<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Product Form — Amma Pickles Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Playfair+Display:wght@700;900&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
    <div th:replace="~{fragments/admin-navbar :: adminNavbar}"></div>
    <div class="page-hdr">
        <h2 th:text="${product != null} ? 'Edit Product' : 'Add Product'">Product Form</h2>
        <p th:text="${product != null} ? 'Update product details' : 'Add a new pickle product'"></p>
    </div>
    <div class="cart-main" style="max-width:700px;">
        <a href="/admin/products" class="pd-back" style="display:inline-flex;margin-bottom:1.5rem;">
            <i class="bi bi-arrow-left"></i> Back to Products
        </a>
        <div class="admin-section">
            <!-- ADD form -->
            <form th:if="${product == null}" th:action="@{/admin/products/add}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="ap-label">Product Name *</label>
                        <input class="ap-input" type="text" name="name" placeholder="e.g. Mango Pickle" required/>
                    </div>
                    <div class="col-md-6">
                        <label class="ap-label">Category *</label>
                        <select name="categoryId" class="admin-select" required>
                            <option value="">Select category</option>
                            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="ap-label">Price (₹) *</label>
                        <input class="ap-input" type="number" name="price" placeholder="199" step="0.01" min="0" required/>
                    </div>
                    <div class="col-md-4">
                        <label class="ap-label">Stock Quantity *</label>
                        <input class="ap-input" type="number" name="quantity" placeholder="50" min="0" required/>
                    </div>
                    <div class="col-md-4">
                        <label class="ap-label">Size</label>
                        <select name="size" class="admin-select">
                            <option value="">No size</option>
                            <option th:each="s : ${sizes}" th:value="${s}" th:text="${s.label}"></option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="ap-label">Description</label>
                        <input class="ap-input" type="text" name="description" placeholder="Short description"/>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn-order" style="width:auto;padding:0.8rem 2.5rem;border:none;cursor:pointer;">
                            <i class="bi bi-plus-circle"></i> Add Product
                        </button>
                    </div>
                </div>
            </form>
            <!-- EDIT form -->
            <form th:if="${product != null}"
                  th:action="@{/admin/products/edit/{id}(id=${product.id})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="ap-label">Product Name *</label>
                        <input class="ap-input" type="text" name="name" th:value="${product.name}" required/>
                    </div>
                    <div class="col-md-6">
                        <label class="ap-label">Category *</label>
                        <select name="categoryId" class="admin-select" required>
                            <option th:each="cat : ${categories}"
                                    th:value="${cat.id}"
                                    th:text="${cat.name}"
                                    th:selected="${cat.id == product.categoryId}"></option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="ap-label">Price (₹) *</label>
                        <input class="ap-input" type="number" name="price" th:value="${product.price}" step="0.01" min="0" required/>
                    </div>
                    <div class="col-md-4">
                        <label class="ap-label">Stock Quantity *</label>
                        <input class="ap-input" type="number" name="quantity" th:value="${product.quantity}" min="0" required/>
                    </div>
                    <div class="col-md-4">
                        <label class="ap-label">Size</label>
                        <select name="size" class="admin-select">
                            <option value="" th:selected="${product.size == null}">No size</option>
                            <option th:each="s : ${sizes}"
                                    th:value="${s}"
                                    th:text="${s.label}"
                                    th:selected="${s == product.size}"></option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="ap-label">Description</label>
                        <input class="ap-input" type="text" name="description" th:value="${product.description}"/>
                    </div>
                    <div class="col-12" style="display:flex;gap:1rem;flex-wrap:wrap;">
                        <button type="submit" class="btn-order" style="width:auto;padding:0.8rem 2.5rem;border:none;cursor:pointer;">
                            <i class="bi bi-check2-circle"></i> Save Changes
                        </button>
                        <a href="/admin/products"
                           style="display:inline-flex;align-items:center;padding:0.8rem 1.5rem;border:1px solid rgba(212,160,23,0.3);border-radius:12px;color:var(--gold-mid);text-decoration:none;font-size:0.85rem;">
                            Cancel
                        </a>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
