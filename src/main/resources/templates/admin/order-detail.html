<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Order Detail — Amma Pickles Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Playfair+Display:wght@700;900&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>

    <div th:replace="~{fragments/admin-navbar :: adminNavbar}"></div>

    <div class="page-hdr">
        <h2 th:text="'Order #' + ${order.id}">Order Detail</h2>
        <p>View and update order status</p>
    </div>

    <div class="cart-main">

        <div th:if="${success}" class="flash-success">
            <i class="bi bi-check-circle-fill"></i>
            <span th:text="${success}"></span>
        </div>

        <a href="/admin/orders" class="pd-back" style="display:inline-flex;margin-bottom:1.5rem;">
            <i class="bi bi-arrow-left"></i> Back to Orders
        </a>

        <div class="row g-4">

            <!-- LEFT -->
            <div class="col-lg-8">
                <div class="order-card">
                    <div class="order-hdr">
                        <div>
                            <div class="order-id" th:text="'Order #' + ${order.id}"></div>
                            <div class="order-date"
                                 th:text="${#temporals.format(order.orderDate, 'dd MMM yyyy, hh:mm a')}"></div>
                        </div>
                        <div style="display:flex;align-items:center;gap:0.5rem;">
                            <span class="admin-cod-badge">
                                <i class="bi bi-cash-coin"></i> COD
                            </span>
                            <span class="status-badge"
                                  th:classappend="' status-' + ${order.status}"
                                  th:text="${order.status}"></span>
                        </div>
                    </div>

                    <div class="order-body">
                        <div class="addr-row" style="margin-bottom:1rem;">
                            <i class="bi bi-geo-alt-fill" style="color:var(--gold-mid);"></i>
                            Delivering to: <span th:text="${order.deliveryAddress}"></span>
                        </div>
                        <table class="items-tbl">
                            <thead>
                                <tr>
                                    <th>Item</th>
                                    <th>Size</th>
                                    <th>Qty</th>
                                    <th class="text-end">Price</th>
                                    <th class="text-end">Amount</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="item : ${order.items}">
                                    <td th:text="${item.productName}"></td>
                                    <td th:text="${item.sizeLabel}"></td>
                                    <td th:text="${item.quantity}"></td>
                                    <td class="text-end" th:text="'₹' + ${item.priceAtTimeOfOrder}"></td>
                                    <td class="amt text-end" th:text="'₹' + ${item.itemTotal}"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="order-ftr">
                        <div class="ftr-item">
                            <div class="fl">Subtotal</div>
                            <div class="fv" th:text="'₹' + ${order.totalAmount}"></div>
                        </div>
                        <div class="ftr-item">
                            <div class="fl">Delivery</div>
                            <div class="fv"
                                 th:text="${order.deliveryCharge != null and order.deliveryCharge > 0} ? '₹' + ${order.deliveryCharge} : 'FREE'">
                            </div>
                        </div>
                        <div class="ftr-item grand">
                            <div class="fl">Grand Total</div>
                            <div class="fv shine-gold" th:text="'₹' + ${order.grandTotal}"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- RIGHT -->
            <div class="col-lg-4">
                <div class="summary-card">
                    <div class="summary-title">Update Status</div>

                    <form th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <label class="ap-label">Change Status To</label>
                        <select name="status" class="admin-select">
                            <option th:each="s : ${statuses}"
                                    th:value="${s}"
                                    th:text="${s}"
                                    th:selected="${s == order.status}">
                            </option>
                        </select>
                        <button type="submit" class="btn-order" style="border:none;cursor:pointer;">
                            <i class="bi bi-check2-circle"></i> Update Status
                        </button>
                    </form>

                    <hr class="admin-hr"/>

                    <div class="admin-section-title">Status Flow</div>
                    <div class="admin-status-flow">
                        <span class="status-badge status-CONFIRMED">CONFIRMED</span> →
                        <span class="status-badge status-SHIPPED">SHIPPED</span> →
                        <span class="status-badge status-DELIVERED">DELIVERED</span>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
