<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Admin Dashboard — Amma Pickles</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Playfair+Display:wght@700;900&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>

    <div th:replace="~{fragments/admin-navbar :: adminNavbar}"></div>

    <div class="page-hdr">
        <h2>📊 Dashboard</h2>
        <p>Welcome back, Admin</p>
    </div>

    <div class="cart-main">

        <div th:if="${success}" class="flash-success">
            <i class="bi bi-check-circle-fill"></i>
            <span th:text="${success}"></span>
        </div>

        <!-- STAT CARDS -->
        <div class="row g-3 mb-4">
            <div class="col-6 col-md-3">
                <div class="admin-stat-card">
                    <div class="admin-stat-label">Total Orders</div>
                    <div class="admin-stat-value shine-gold" th:text="${totalOrders}">0</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="admin-stat-card">
                    <div class="admin-stat-label">Total Revenue</div>
                    <div class="admin-stat-value shine-gold" th:text="'₹' + ${totalRevenue}">₹0</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="admin-stat-card">
                    <div class="admin-stat-label">Total Users</div>
                    <div class="admin-stat-value shine-gold" th:text="${totalUsers}">0</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="admin-stat-card" style="border-color:rgba(255,152,0,0.3);">
                    <div class="admin-stat-label" style="color:#FFB74D;">Pending</div>
                    <div class="admin-stat-value" style="color:#FFB74D;" th:text="${pendingOrders}">0</div>
                </div>
            </div>
        </div>

        <!-- STATUS BREAKDOWN -->
        <div class="admin-section">
            <div class="admin-section-title">Order Status Breakdown</div>
            <div class="row g-3">
                <div class="col-6 col-md-3">
                    <div class="admin-status-card" style="background:rgba(33,150,243,0.08);border:1px solid rgba(33,150,243,0.3);">
                        <div class="admin-status-label" style="color:#64B5F6;">CONFIRMED</div>
                        <div class="admin-status-value" style="color:#64B5F6;" th:text="${pendingOrders}">0</div>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="admin-status-card" style="background:rgba(156,39,176,0.08);border:1px solid rgba(156,39,176,0.3);">
                        <div class="admin-status-label" style="color:#CE93D8;">SHIPPED</div>
                        <div class="admin-status-value" style="color:#CE93D8;" th:text="${shippedOrders}">0</div>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="admin-status-card" style="background:rgba(76,175,80,0.08);border:1px solid rgba(76,175,80,0.3);">
                        <div class="admin-status-label" style="color:#81C784;">DELIVERED</div>
                        <div class="admin-status-value" style="color:#81C784;" th:text="${deliveredOrders}">0</div>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="admin-status-card" style="background:rgba(139,0,0,0.08);border:1px solid rgba(139,0,0,0.3);">
                        <div class="admin-status-label" style="color:#EF9A9A;">CANCELLED</div>
                        <div class="admin-status-value" style="color:#EF9A9A;" th:text="${cancelledOrders}">0</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- QUICK LINKS -->
        <div class="row g-3">
            <div class="col-md-6">
                <a href="/admin/orders" class="btn-order" style="text-decoration:none;display:block;text-align:center;">
                    <i class="bi bi-bag-check"></i> Manage Orders
                </a>
            </div>
            <div class="col-md-6">
                <a href="/admin/products" class="btn-order"
                   style="text-decoration:none;display:block;text-align:center;background:transparent;border:1.5px solid rgba(212,160,23,0.4);color:var(--gold-mid);">
                    <i class="bi bi-box-seam"></i> Manage Products
                </a>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
