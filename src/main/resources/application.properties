spring.application.name=AmmaPickles
server.port=${PORT:8080}

# DB (Aiven MySQL Free Tier)
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?sslMode=REQUIRED
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA OPTIMIZED FOR LOW MEMORY
spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Hikari Connection Pool (Strictly balanced for Aiven Free Tier limits)
spring.datasource.hikari.initializationFailTimeout=0
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

# JWT (Secure 256-bit fallback key)
jwt.secret=${JWT_SECRET:default_secret_key_for_ammapickles_ecommerce_32chars}
jwt.expiration=86400000

# Actuator
management.endpoints.web.exposure.include=health

# Mail (Brevo)
app.mail.from=${MAIL_FROM:reachraviraju@gmail.com}

# Startup optimization
spring.main.lazy-initialization=true

# Cache
spring.cache.type=simple

# HTTP Gzip Compression (Saves Render free-tier bandwidth)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Static Resource Caching (30 days browser cache for CSS, images, JS)
spring.web.resources.cache.cachecontrol.max-age=30d
spring.web.resources.cache.cachecontrol.cache-public=true